services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: "5002"
      DATABASE_URL: ${DATABASE_URL}
      META_ADS_PROXY: ${META_ADS_PROXY}
      INGEST_TOKEN: ${INGEST_TOKEN}
      SECRET_KEY: ${SECRET_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SESSION_DAYS: ${SESSION_DAYS:-7}
      META_ADS_DELAY: ${META_ADS_DELAY:-0.3}
      META_ADS_JITTER: ${META_ADS_JITTER:-0.3}
      META_ADS_LAUNCH_EARLY_STOP: ${META_ADS_LAUNCH_EARLY_STOP:-500}
      SCRAPE_ENABLED: "true"
    expose:
      - "5002"
    ports:
      - "5002:5002"
    restart: unless-stopped
