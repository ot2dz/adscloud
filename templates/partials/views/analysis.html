  <!-- VIEW: AI COMPETITOR ANALYSIS -->
  <section id="view-analysis" class="hidden space-y-4">
    <div class="bg-white border border-[#cfe0f5] rounded-2xl p-5 shadow-[0_8px_20px_rgba(23,43,77,0.04)] space-y-4">
      <div>
        <h2 class="text-lg font-extrabold text-[#102a56]">🤖 تحليل المنافس بالذكاء الاصطناعي</h2>
        <p class="text-xs text-slate-500 font-semibold mt-1 leading-relaxed">
          الصق رابط متجر المنافس. نجمع إعلاناته من قاعدة البيانات فقط، نحذف النصوص المكررة (مع حساب عدد التكرار)، ثم يكتب الذكاء الاصطناعي تقريراً عن طريقة عمله.
        </p>
      </div>
      <div class="grid md:grid-cols-[1fr_auto] gap-3 items-end">
        <label class="block text-xs">
          <span class="block text-slate-700 font-bold mb-1">رابط المتجر أو الدومين:</span>
          <input id="an-store" type="text" dir="ltr" placeholder="https://store.youcan.shop/products/..."
            onkeydown="if(event.key==='Enter') anPreview()"
            class="w-full bg-[#f8fbff] border border-[#b7c9e2] rounded-xl px-3 py-2.5 text-slate-800 placeholder-slate-400 font-mono text-sm focus:outline-none focus:ring-1 focus:ring-blue-500">
        </label>
        <label class="block text-xs">
          <span class="block text-slate-700 font-bold mb-1">لغة التقرير:</span>
          <select id="an-lang" class="bg-white text-slate-700 font-bold rounded-xl px-3 py-2.5 border border-[#b7c9e2] text-xs">
            <option value="auto">تلقائي (لغة طلبك)</option>
            <option value="ar">العربية</option>
            <option value="dz">الدارجة الجزائرية</option>
            <option value="fr">Français</option>
            <option value="en">English</option>
          </select>
        </label>
      </div>
      <label class="block text-xs">
        <span class="block text-slate-700 font-bold mb-1">طلبك أو ملاحظاتك (اختياري):</span>
        <textarea id="an-note" rows="2" dir="auto" placeholder="مثال: واش هو المنتج اللي راه يربح بيه؟ وكيفاش نقدر نتفوق عليه في السوم؟"
          class="w-full bg-[#f8fbff] border border-[#b7c9e2] rounded-xl px-3 py-2 text-slate-800 placeholder-slate-400 text-sm focus:outline-none focus:ring-1 focus:ring-blue-500"></textarea>
      </label>
      <div class="flex gap-2.5">
        <button id="an-preview-btn" onclick="anPreview()" class="bg-[#174ea6] hover:bg-[#123f87] text-white rounded-xl px-6 py-2.5 font-bold transition text-xs shadow-sm">🔍 فحص الإعلانات</button>
      </div>
      <div id="an-preview" class="hidden"></div>
    </div>

    <div id="an-report-wrap" class="hidden bg-white border border-[#cfe0f5] rounded-2xl p-5 shadow-[0_8px_20px_rgba(23,43,77,0.04)]">
      <div id="an-report-head" class="flex items-start justify-between gap-3 flex-wrap border-b border-slate-100 pb-3 mb-4"></div>
      <div id="an-report" class="an-md text-sm text-slate-800 leading-relaxed" dir="auto"></div>
    </div>

    <div class="bg-white border border-[#cfe0f5] rounded-2xl p-5 shadow-[0_8px_20px_rgba(23,43,77,0.04)]">
      <div class="flex items-center justify-between mb-3">
        <h3 class="font-bold text-[#102a56] text-sm">📚 التقارير المحفوظة</h3>
        <button onclick="anLoadReports()" class="text-xs px-3 py-1.5 rounded-lg border border-[#b7c9e2] font-bold text-slate-700 hover:bg-slate-50">تحديث</button>
      </div>
      <div id="an-reports" class="space-y-2 text-xs"></div>
    </div>
  </section>
