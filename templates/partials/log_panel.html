  <!-- Console Log Box (admin, collapsed by default) -->
  <details data-admin-only class="hidden scard">

      <span>سجل الأحداث والمحرك</span>
      <span class="text-[11px] text-slate-400 font-mono">Live Logs</span>
    </summary>

      <div class="flex items-center justify-end gap-2 mb-2">
        <button type="button" onclick="clearLogs()" class="text-[11px] px-2 py-0.5 rounded-lg border border-slate-200 text-slate-500 hover:bg-slate-50 font-bold">مسح</button>

      <pre id="log" class="text-xs bg-slate-900 text-slate-300 rounded-xl p-3.5 h-56 overflow-auto whitespace-pre-wrap leading-5 font-mono" dir="auto"></pre>
